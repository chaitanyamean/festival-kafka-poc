server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: payment-service
  main:
    banner-mode: off
    web-application-type: servlet
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:paymentdb}
    username: ${POSTGRES_USER:fkp}
    password: ${POSTGRES_PASSWORD:fkp}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
      specific.avro.reader: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: "1"
    consumer:
      group-id: ${CONSUMER_GROUP:payment-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
    listener:
      ack-mode: record

# Simulated payment gateway. Phase 2 can swap this for a real client.
payment:
  gateway:
    # Probability (0.0 .. 1.0) that a capture will be marked failed. Default 5%
    # to deliberately exercise the inventory-release compensation path in Phase 1.
    failure-rate: ${PAYMENT_FAILURE_RATE:0.05}
    # Artificial per-capture delay (ms) to simulate a slow gateway. Default 50ms
    # so the demo shows realistic end-to-end latency instead of free-fall numbers.
    processing-delay-ms: ${PAYMENT_DELAY_MS:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
        spring.kafka.template: true
      slo:
        http.server.requests: 10ms,50ms,100ms,250ms,500ms,1s,2s,5s

logging:
  level:
    root: INFO
    com.festivalkafka: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
