      OTEL_PROPAGATORS: "tracecontext,baggage"
      OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES: "true"
      KAFKA_BOOTSTRAP: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: shippingdb
      POSTGRES_USER: ${POSTGRES_USER:-fkp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fkp}
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [fkp]

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    image: ${FKP_IMAGE_REGISTRY:-fkp}/notification-service:${IMAGE_TAG:-local}
    container_name: fkp-notification-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    environment:
      <<: *fkp-consumer-tuning
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xmx320m -Xms128m"
      JAVA_TOOL_OPTIONS: "-javaagent:/opt/opentelemetry-javaagent.jar"
      OTEL_SERVICE_NAME: notification-service
      OTEL_RESOURCE_ATTRIBUTES: "service.name=notification-service,service.namespace=festival-kafka-poc,deployment.environment=${FKP_ENV:-local}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"   # metrics come from the Micrometer Prometheus scrape, not the agent
      OTEL_LOGS_EXPORTER: "none"
      OTEL_PROPAGATORS: "tracecontext,baggage"
      OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES: "true"
      KAFKA_BOOTSTRAP: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: notificationdb
      POSTGRES_USER: ${POSTGRES_USER:-fkp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fkp}
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [fkp]

  analytics-service:
    build:
      context: ..
      dockerfile: services/analytics-service/Dockerfile
    image: ${FKP_IMAGE_REGISTRY:-fkp}/analytics-service:${IMAGE_TAG:-local}
    container_name: fkp-analytics-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    environment:
      <<: *fkp-consumer-tuning
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xmx320m -Xms128m"
      JAVA_TOOL_OPTIONS: "-javaagent:/opt/opentelemetry-javaagent.jar"
      OTEL_SERVICE_NAME: analytics-service
      OTEL_RESOURCE_ATTRIBUTES: "service.name=analytics-service,service.namespace=festival-kafka-poc,deployment.environment=${FKP_ENV:-local}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"   # metrics come from the Micrometer Prometheus scrape, not the agent
      OTEL_LOGS_EXPORTER: "none"
      OTEL_PROPAGATORS: "tracecontext,baggage"
      OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES: "true"
      KAFKA_BOOTSTRAP: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: analyticsdb
      POSTGRES_USER: ${POSTGRES_USER:-fkp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fkp}
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [fkp]

  # ----------------------------------------------------------------------------
  # Load generator — profile-gated. Does NOT start on default `compose up`.
  # Run with `docker compose --profile load run --rm load-generator <args>`
  # or (preferred) `make demo-phase1`.
  # ----------------------------------------------------------------------------
  load-generator:
    profiles: ["load"]
    build:
      context: ..
      dockerfile: services/load-generator/Dockerfile
    image: ${FKP_IMAGE_REGISTRY:-fkp}/load-generator:${IMAGE_TAG:-local}
    container_name: fkp-load-generator
    depends_on:
      order-api:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xmx192m -Xms64m"
    command: ["--host", "http://order-api:8080", "--rps", "100", "--duration-sec", "60", "--max-items", "3"]
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [fkp]

networks:
  fkp:
    name: fkp-net
    driver: bridge

volumes:
  kafka-data:
  postgres-data:
  prometheus-data:
  grafana-data:
