# festival-kafka-poc — OpenTelemetry Collector config.
#
# Pipeline:
#   services (OTel Java agent) --OTLP/HTTP:4318--> collector --OTLP/gRPC:4317--> jaeger
#
# Metrics go through Prometheus scrape (not OTLP) by design, so this collector
# only handles traces. Collector-own telemetry (:8888) is still scraped by
# Prometheus so we can watch the collector itself.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Batch spans before export to amortize per-RPC overhead.
  batch:
    send_batch_size: 512
    send_batch_max_size: 1024
    timeout: 2s

  # Cap in-memory batches so a Jaeger outage can't OOM the collector.
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 32

  # Keep every span kind we care about (CLIENT/SERVER/CONSUMER/PRODUCER)
  # and drop the known-noisy actuator probes. Expressions use OTTL.
  filter/drop_actuator:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(attributes["url.path"], "^/actuator/.*")'
        - 'IsMatch(attributes["http.target"], "^/actuator/.*")'
        - 'IsMatch(attributes["http.route"], "^/actuator/.*")'

exporters:
  # Forward to Jaeger via native OTLP (Jaeger v1.60 supports OTLP when
  # COLLECTOR_OTLP_ENABLED=true, which the compose block sets).
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Debug exporter — only enabled on demand with `--set service.pipelines.traces.exporters=debug,otlp/jaeger`.
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  # /health on :13133 — currently unused for the compose healthcheck
  # (which uses `otelcol-contrib components`) but handy from the host.
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, filter/drop_actuator, batch]
      exporters:  [otlp/jaeger]

  # Collector's own metrics on :8888. Prometheus scrapes this.
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
